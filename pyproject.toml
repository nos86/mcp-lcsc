[project]
name = "lcsc-mcp"
version = "0.1.0"
description = "MCP server for LCSC component search and datasheet extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12.0,<2",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pymupdf4llm>=0.0.17",
  "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
lcsc-mcp = "lcsc_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
